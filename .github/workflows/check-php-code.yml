name: Check PHP Code

on:
  push:
    branches: [j5, j6]
  pull_request:
    branches: [j5, j6]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint PHP files
        run: |
          status=0
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null || status=1
          done < <(find . -name '*.php' -not -path './.git/*' -print0)
          exit $status

      - name: Run QA tools on this PHP version
        run: |
          php build/check-translation.php
          php build/bump.php --help
