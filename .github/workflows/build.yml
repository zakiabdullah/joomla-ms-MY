name: Build Joomla Language Pack

on:
  push:
    branches: [j5, j6]
    tags: ['*']
  pull_request:
    branches: [j5, j6]

permissions:
  contents: write

jobs:
  build:
    name: Build packages
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check language files
        shell: pwsh
        run: php build/check-translation.php

      # build.ps1 builds every enabled target in build/build.config.json
      - name: Build language packs
        shell: pwsh
        run: ./build.ps1 -ConfigPath build/build.config.json

      - name: Verify artifacts and write checksums
        shell: pwsh
        run: |
          $zips = Get-ChildItem dist/pkg_ms-MY_*.zip
          if ($zips.Count -lt 2) { throw "Expected j5 and j6 packages in dist/, found $($zips.Count)" }
          foreach ($zip in $zips) {
            if ($zip.Length -le 0) { throw "Empty artifact: $($zip.Name)" }
          }
          $zips | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content -Path dist/SHA256SUMS.txt -Encoding utf8NoBOM
          Get-Content dist/SHA256SUMS.txt

      - name: Upload j5 package
        uses: actions/upload-artifact@v7
        with:
          name: j5-language-pack
          path: dist/pkg_ms-MY_j5.zip

      - name: Upload j6 package
        uses: actions/upload-artifact@v7
        with:
          name: j6-language-pack
          path: dist/pkg_ms-MY_j6.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/pkg_ms-MY_j5.zip
            dist/pkg_ms-MY_j6.zip
            dist/SHA256SUMS.txt
          body_path: RELEASE_NOTES_DRAFT.md
          generate_release_notes: true
