name: Build Joomla Language Pack

on:
  push:
    branches: [j5]
    tags: ['*']
  pull_request:
    branches: [j5]

permissions:
  contents: write

jobs:
  build:
    name: Build packages
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check language files
        shell: pwsh
        run: php build/check-translation.php

      # Fails early when CHANGELOG.md has no section for the tag or the tag does
      # not match the j5 packageVersion in build/build.config.json
      - name: Release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          php build/release-notes.php "${{ github.ref_name }}" > release-notes.md
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Content release-notes.md

      # build.ps1 builds every enabled target in build/build.config.json
      - name: Build language packs
        shell: pwsh
        run: ./build.ps1 -ConfigPath build/build.config.json

      - name: Verify artifacts and write checksums
        shell: pwsh
        run: |
          # Official naming: ms-MY_joomla_lang_full_<joomla version>v<pack>.zip
          $zips = Get-ChildItem dist/ms-MY_joomla_lang_full_*.zip
          foreach ($major in 5, 6) {
            if (-not ($zips | Where-Object Name -like "ms-MY_joomla_lang_full_$major.*")) {
              throw "Missing Joomla $major package in dist/"
            }
          }
          foreach ($zip in $zips) {
            if ($zip.Length -le 0) { throw "Empty artifact: $($zip.Name)" }
          }
          # LF line endings so `sha256sum -c SHA256SUMS.txt` works on Linux and macOS
          # (Set-Content on the Windows runner would write CRLF)
          $lines = $zips | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) }
          [System.IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", (($lines -join "`n") + "`n"), [System.Text.UTF8Encoding]::new($false))
          Get-Content dist/SHA256SUMS.txt

      - name: Upload j5 package
        uses: actions/upload-artifact@v7
        with:
          name: j5-language-pack
          path: dist/ms-MY_joomla_lang_full_5.*.zip
          if-no-files-found: error

      - name: Upload j6 package
        uses: actions/upload-artifact@v7
        with:
          name: j6-language-pack
          path: dist/ms-MY_joomla_lang_full_6.*.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/ms-MY_joomla_lang_full_*.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          body_path: release-notes.md
