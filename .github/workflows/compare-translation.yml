name: Sync Check with Joomla CMS

on:
  schedule:
    # Every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      strict:
        description: 'Fail when keys are missing (not only on placeholder mismatches)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  compare:
    name: ms-MY vs joomla-cms ${{ matrix.branch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Development branches: catch new strings before the next release
          - branch: 5.4-dev
            target: j5
          - branch: 6.2-dev
            target: j6
          # Next minor in development
          - branch: 6.3-dev
            target: j6

    steps:
      - name: Checkout ms-MY repository
        uses: actions/checkout@v4
        with:
          path: ms-MY

      - name: Checkout joomla-cms (en-GB language files only)
        id: cms
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: joomla/joomla-cms
          ref: ${{ matrix.branch }}
          path: joomla-cms
          sparse-checkout: |
            language/en-GB
            administrator/language/en-GB
            api/language/en-GB
            installation/language/en-GB

      - name: Branch not available
        if: steps.cms.outcome != 'success'
        run: echo "::notice::joomla-cms branch ${{ matrix.branch }} does not exist (yet); skipping."

      - name: Setup PHP
        if: steps.cms.outcome == 'success'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Compare with en-GB
        if: steps.cms.outcome == 'success'
        working-directory: ms-MY
        run: |
          php build/check-translation.php \
            --ref=../joomla-cms \
            --target=${{ matrix.target }} \
            --summary="$GITHUB_STEP_SUMMARY" \
            ${{ inputs.strict && '--strict' || '' }}
