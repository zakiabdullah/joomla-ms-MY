name: Sync Check with Joomla CMS

on:
  schedule:
    # Every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  # Also after translation changes, so issues and the coverage badge update right away
  push:
    branches: [j5]
    paths:
      - '**.ini'
      - 'overrides/**'
  workflow_dispatch:
    inputs:
      strict:
        description: 'Fail when keys are missing (not only report them)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  compare:
    name: ms-MY vs joomla-cms ${{ matrix.branch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Development branches: catch new strings before the next release
          - branch: 5.4-dev
            target: j5
            badge: true
          - branch: 6.2-dev
            target: j6
            badge: true
          # Next minor in development (not part of the coverage badge)
          - branch: 6.3-dev
            target: j6
            badge: false

    steps:
      - name: Checkout ms-MY repository
        uses: actions/checkout@v7
        with:
          path: ms-MY

      - name: Checkout joomla-cms (en-GB language files only)
        id: cms
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: joomla/joomla-cms
          ref: ${{ matrix.branch }}
          path: joomla-cms
          sparse-checkout: |
            language/en-GB
            administrator/language/en-GB
            api/language/en-GB
            installation/language/en-GB

      - name: Branch not available
        if: steps.cms.outcome != 'success'
        run: echo "::notice::joomla-cms branch ${{ matrix.branch }} does not exist (yet); skipping."

      - name: Setup PHP
        if: steps.cms.outcome == 'success'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Compare with en-GB
        if: steps.cms.outcome == 'success'
        working-directory: ms-MY
        run: |
          php build/check-translation.php \
            --ref=../joomla-cms \
            --target=${{ matrix.target }} \
            --summary="$GITHUB_STEP_SUMMARY" \
            --json=../qa.json

      # One issue per Joomla branch: opened or updated while strings are missing,
      # closed automatically once the translation is complete again.
      - name: Open, update or close the tracking issue
        if: steps.cms.outcome == 'success' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ matrix.branch }}
          TARGET: ${{ matrix.target }}
        run: |
          title="Terjemahan baharu diperlukan: Joomla $BRANCH"
          gh label create sync --color 1d76db --description "Strings to translate from joomla-cms" --force >/dev/null
          number=$(gh issue list --label sync --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          count=$(jq '.warnings | length' qa.json)

          if [ "$count" -eq 0 ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "Semua rentetan Joomla $BRANCH sudah lengkap diterjemah. ✅"
            fi
            exit 0
          fi

          {
            echo "Semakan automatik mendapati **$count** perkara yang perlu diterjemah atau dibetulkan berbanding \`joomla-cms@$BRANCH\` (target \`$TARGET\`)."
            echo
            echo "| Fail | Masalah |"
            echo "|---|---|"
            jq -r '.warnings[:300][] | "| `\(.file)` | \(.message | gsub("\\|"; "\\|")) |"' qa.json
            if [ "$count" -gt 300 ]; then echo; echo "_…dan $((count - 300)) lagi. Lihat log run._"; fi
            echo
            echo "Rujuk [GLOSSARY.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/j5/GLOSSARY.md) dan [CONTRIBUTING.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/j5/CONTRIBUTING.md)."
            echo "Isu ini dikemas kini secara automatik oleh [run ini]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          } > body.md

          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file body.md
          else
            gh issue create --title "$title" --label sync --body-file body.md
          fi

      - name: Keep the result for the coverage badge
        if: steps.cms.outcome == 'success' && matrix.badge
        uses: actions/upload-artifact@v7
        with:
          name: qa-${{ matrix.branch }}
          path: qa.json
          retention-days: 7

      - name: Fail in strict mode
        if: steps.cms.outcome == 'success' && inputs.strict
        run: |
          if [ "$(jq '.warnings | length' qa.json)" -gt 0 ]; then
            echo "::error::Missing or mismatched strings found against ${{ matrix.branch }}"
            exit 1
          fi

  # Publishes badges/coverage.json for the README badge (shields.io endpoint).
  # j5 is protected, so the data lives on a small separate branch named "badges".
  badge:
    name: Update coverage badge
    needs: compare
    if: always() && github.ref == 'refs/heads/j5'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download results
        uses: actions/download-artifact@v8
        with:
          pattern: qa-*
          path: results

      - name: Compute coverage
        id: coverage
        run: |
          # Lowest coverage of the current Joomla lines (5.4 and 6.2)
          if ! ls results/*/qa.json >/dev/null 2>&1; then
            echo "::warning::No comparison results; badge not updated."
            exit 1
          fi
          value=$(jq -s 'map(.coverage) | min' results/*/qa.json)
          color=$(jq -rn --argjson v "$value" 'if $v >= 100 then "brightgreen" elif $v >= 98 then "green" elif $v >= 90 then "yellow" else "orange" end')
          jq -n --arg msg "${value}%" --arg color "$color"             '{schemaVersion: 1, label: "translated", message: $msg, color: $color}' > coverage.json
          cat coverage.json
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Publish to the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/badges/coverage.json" || true)
          if [ "$current" = "$(cat coverage.json)" ]; then
            echo "Badge unchanged (${{ steps.coverage.outputs.value }}%)."
            exit 0
          fi
          mkdir publish && cp coverage.json publish/
          cat > publish/README.md <<'MD'
          Data for the README badges, written by the "Sync Check with Joomla CMS" workflow.
          Do not edit by hand.
          MD
          cd publish
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Translation coverage: ${{ steps.coverage.outputs.value }}%"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
